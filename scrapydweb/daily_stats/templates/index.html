<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>爬虫任务看板</title>
  <style>
  :root {
    --bg: #07111f;
    --panel: rgba(10, 25, 46, 0.78);
    --panel-strong: rgba(12, 33, 61, 0.92);
    --line: rgba(122, 188, 255, 0.22);
    --text: #eef7ff;
    --muted: #8ea6bd;
    --cyan: #35d5ff;
    --green: #4ee08b;
    --amber: #ffd166;
    --blue: #6aa9ff;
    --red: #ff6b6b;
  }
  body {
    margin: 0;
    font-family: "DIN Alternate", "Avenir Next Condensed", "Trebuchet MS", sans-serif;
    background:
      radial-gradient(circle at 18% 18%, rgba(53, 213, 255, 0.22), transparent 30%),
      radial-gradient(circle at 82% 8%, rgba(78, 224, 139, 0.16), transparent 24%),
      linear-gradient(135deg, rgba(3, 9, 18, 0.88) 0%, rgba(5, 17, 31, 0.76) 45%, rgba(3, 8, 15, 0.90) 100%),
      url("https://www.oxts.com/wp-content/uploads/2025/02/Satellite-view-of-earth-from-space-cropped-for-web-1-1200x0-c-default.webp");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: var(--text);
    overflow-x: hidden;
  }
  * {
    box-sizing: border-box;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(122, 188, 255, 0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(122, 188, 255, 0.07) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.92), transparent 86%);
  }
  body::after {
    content: "";
    position: fixed;
    left: -10%;
    right: -10%;
    top: 18%;
    height: 1px;
    pointer-events: none;
    background: linear-gradient(90deg, transparent, rgba(53, 213, 255, 0.72), transparent);
    box-shadow: 0 0 28px rgba(53, 213, 255, 0.45);
    animation: scan 5.6s linear infinite;
  }
  .page {
    max-width: 1680px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 42px 24px 56px;
    position: relative;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 32px;
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    border: 1px solid rgba(53, 213, 255, 0.32);
    border-radius: 999px;
    padding: 7px 13px;
    background: rgba(53, 213, 255, 0.08);
    color: var(--cyan);
    font-size: 13px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin-bottom: 12px;
    box-shadow: inset 0 0 18px rgba(53, 213, 255, 0.08);
  }
  .title {
    margin: 0;
    font-size: clamp(38px, 6vw, 72px);
    line-height: 0.95;
    letter-spacing: 0.02em;
    text-shadow: 0 0 34px rgba(53, 213, 255, 0.28);
  }
  .subtitle {
    max-width: 720px;
    margin: 16px 0 0;
    color: var(--muted);
    font-size: 16px;
    line-height: 1.7;
  }
  .nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 10px;
  }
  .button {
    display: inline-block;
    border: 1px solid rgba(53, 213, 255, 0.24);
    border-radius: 999px;
    padding: 10px 16px;
    background: rgba(8, 27, 49, 0.64);
    color: #d9f7ff;
    font-size: 14px;
    text-decoration: none;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.18), inset 0 0 18px rgba(53, 213, 255, 0.06);
    white-space: nowrap;
    transition: transform 0.18s ease, border-color 0.18s ease, color 0.18s ease;
  }
  .button:hover {
    border-color: rgba(53, 213, 255, 0.72);
    color: #fff;
    transform: translateY(-2px);
  }
  .hero-panel {
    position: relative;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 24px;
    background: linear-gradient(135deg, rgba(10, 25, 46, 0.82), rgba(8, 18, 31, 0.72));
    box-shadow: 0 28px 80px rgba(0, 0, 0, 0.34);
  }
  .hero-panel::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(120deg, rgba(53, 213, 255, 0.16), transparent 34%),
      linear-gradient(300deg, rgba(78, 224, 139, 0.11), transparent 42%);
  }
  .hero-panel::after {
    content: "";
    position: absolute;
    inset: 1px;
    pointer-events: none;
    border-radius: 27px;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }
  .dashboard {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: repeat(3, minmax(220px, 1fr));
    gap: 16px;
  }
  .metric-card {
    position: relative;
    min-height: 214px;
    overflow: hidden;
    border: 1px solid rgba(122, 188, 255, 0.18);
    border-radius: 22px;
    padding: 24px 24px 22px;
    background: linear-gradient(180deg, rgba(16, 39, 70, 0.86), rgba(8, 19, 34, 0.74));
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 20px 42px rgba(0, 0, 0, 0.22);
    animation: rise 0.56s ease both;
  }
  .metric-card:nth-child(1) {
    grid-column: span 2;
    border-color: rgba(53, 213, 255, 0.34);
  }
  .metric-card:nth-child(2) {
    border-color: rgba(78, 224, 139, 0.28);
  }
  .metric-card:nth-child(3) {
    border-color: rgba(106, 169, 255, 0.28);
  }
  .metric-card:nth-child(4) {
    border-color: rgba(255, 209, 102, 0.28);
  }
  .metric-card:nth-child(5) {
    border-color: rgba(53, 213, 255, 0.26);
  }
  .metric-card:nth-child(6) {
    border-color: rgba(255, 107, 107, 0.36);
  }
  .metric-card:nth-child(1) .metric-value {
    font-size: clamp(52px, 8vw, 96px);
  }
  .metric-card:nth-child(1)::before {
    content: "";
    position: absolute;
    left: 24px;
    right: 24px;
    bottom: 22px;
    height: 48px;
    opacity: 0.52;
    background:
      linear-gradient(90deg, transparent 0 6%, rgba(53, 213, 255, 0.52) 6% 8%, transparent 8% 14%, rgba(53, 213, 255, 0.30) 14% 18%, transparent 18% 28%, rgba(53, 213, 255, 0.62) 28% 31%, transparent 31% 44%, rgba(53, 213, 255, 0.24) 44% 48%, transparent 48% 58%, rgba(53, 213, 255, 0.48) 58% 61%, transparent 61% 70%, rgba(53, 213, 255, 0.32) 70% 73%, transparent 73% 100%);
  }
  .metric-card::after {
    content: "";
    position: absolute;
    right: -56px;
    top: -56px;
    width: 146px;
    height: 146px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(53, 213, 255, 0.26), transparent 66%);
    filter: blur(2px);
  }
  .metric-label {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    color: #a9bdd0;
    font-size: 15px;
    margin-bottom: 30px;
    letter-spacing: 0.04em;
  }
  .metric-label::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 16px var(--cyan);
  }
  .metric-value {
    position: relative;
    z-index: 1;
    color: #f4fbff;
    font-size: clamp(38px, 5vw, 64px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.03em;
    text-shadow: 0 0 30px rgba(53, 213, 255, 0.22);
  }
  .metric-code {
    position: absolute;
    right: 22px;
    bottom: 18px;
    color: rgba(169, 189, 208, 0.32);
    font-size: 12px;
    letter-spacing: 0.12em;
  }
  .footer-note {
    margin-top: 24px;
    color: var(--muted);
    font-size: 13px;
    text-align: right;
  }
  @keyframes scan {
    0% {
      transform: translateY(-32vh);
      opacity: 0;
    }
    16%, 76% {
      opacity: 1;
    }
    100% {
      transform: translateY(86vh);
      opacity: 0;
    }
  }
  @keyframes rise {
    from {
      opacity: 0;
      transform: translateY(18px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  @media (max-width: 1080px) {
    .dashboard {
      grid-template-columns: repeat(2, minmax(180px, 1fr));
    }
    .metric-card:nth-child(1) {
      grid-column: span 2;
    }
  }
  @media (max-width: 760px) {
    .page {
      padding: 26px 14px 36px;
    }
    .header {
      display: block;
    }
    .title {
      font-size: 30px;
    }
    .nav {
      justify-content: flex-start;
      margin-top: 18px;
    }
    .dashboard {
      grid-template-columns: 1fr;
    }
    .hero-panel {
      padding: 14px;
      border-radius: 22px;
    }
    .metric-card:nth-child(1) {
      grid-column: span 1;
    }
    .metric-card {
      min-height: 154px;
      padding: 20px;
    }
    .metric-card:nth-child(1) .metric-value {
      font-size: clamp(42px, 12vw, 62px);
    }
    .footer-note {
      text-align: left;
    }
  }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <div>
        <div class="eyebrow">Crawler Operations Dashboard</div>
        <h1 class="title">爬虫任务看板</h1>
        <p class="subtitle">首页只展示全局规模和当前运行态，日报、周报、年报继续承载周期报表明细。</p>
      </div>
      <div class="nav">
        <a class="button" href="{{ url_for('daily_stats.daily_stats') }}">任务日报</a>
        <a class="button" href="{{ url_for('daily_stats.weekly_stats') }}">任务周报</a>
        <a class="button" href="{{ url_for('daily_stats.annual_stats') }}">任务年报</a>
        <a class="button" href="{{ url_for('daily_stats.coverage_stats') }}">抓全率</a>
        <a class="button" style="margin-left:auto;" href="{{ url_for('index', node=1) }}">返回 ScrapydWeb</a>
      </div>
    </div>

    <div class="hero-panel">
      <div class="dashboard">
        {% for card in cards %}
        <div class="metric-card" style="animation-delay: {{ loop.index0 * 0.07 }}s;">
          <div class="metric-label">{{ card.label }}</div>
          <div class="metric-value">{{ card.value }}</div>
          <div class="metric-code">METRIC 0{{ loop.index }}</div>
        </div>
        {% endfor %}
      </div>
    </div>

    <div class="footer-note">页面更新时间：{{ now }}</div>
  </div>
  <script>
  (function () {
    var duration = 1800;

    function formatNumber(value) {
      return String(value).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    function parseNumber(text) {
      text = (text || '').replace(/,/g, '').trim();
      text = text.replace(/%$/, '');
      if (!/^\d+(?:\.\d+)?$/.test(text)) {
        return null;
      }
      return parseFloat(text);
    }

    function getDecimalPlaces(text) {
      text = (text || '').replace(/,/g, '').trim();
      text = text.replace(/%$/, '');
      var match = text.match(/\.(\d+)$/);
      return match ? match[1].length : 0;
    }

    function hasPercentSuffix(text) {
      return /%$/.test((text || '').trim());
    }

    function formatValue(value, decimalPlaces, suffix) {
      if (decimalPlaces > 0) {
        var fixedText = Number(value).toFixed(decimalPlaces);
        var parts = fixedText.split('.');
        return formatNumber(parseInt(parts[0], 10)) + '.' + parts[1] + suffix;
      }
      return formatNumber(Math.floor(value)) + suffix;
    }

    function animateNumberElement(element) {
      var targetText = element.textContent;
      var target = parseNumber(element.textContent);
      if (target === null || element.getAttribute('data-counted') === '1') {
        return;
      }
      var decimalPlaces = getDecimalPlaces(targetText);
      var suffix = hasPercentSuffix(targetText) ? '%' : '';
      element.setAttribute('data-counted', '1');
      var startTime = null;
      function tick(timestamp) {
        if (!startTime) {
          startTime = timestamp;
        }
        var progress = Math.min((timestamp - startTime) / duration, 1);
        var eased = 1 - Math.pow(1 - progress, 4);
        element.textContent = formatValue(target * eased, decimalPlaces, suffix);
        if (progress < 1) {
          window.requestAnimationFrame(tick);
        } else {
          element.textContent = formatValue(target, decimalPlaces, suffix);
        }
      }
      window.requestAnimationFrame(tick);
    }

    Array.prototype.forEach.call(
      document.querySelectorAll('.metric-value'),
      animateNumberElement
    );
  })();
  </script>
</body>
</html>
