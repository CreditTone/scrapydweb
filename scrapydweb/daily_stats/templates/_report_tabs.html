<style>
  .report-tabs-shell {
    position: relative;
    z-index: 20;
    width: 100%;
    box-sizing: border-box;
    padding: 0;
    background: rgba(7, 17, 31, 0.94);
    border-bottom: 1px solid rgba(122, 188, 255, 0.22);
    backdrop-filter: blur(14px);
  }
  .report-tabs {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    max-width: var(--report-tabs-max-width, 1680px);
    margin: 0 auto;
    padding: 12px var(--report-tabs-side-padding, 20px) 0;
    overflow-x: auto;
    scrollbar-width: thin;
  }
  .report-tab {
    flex: 0 0 auto;
    min-width: 96px;
    padding: 11px 18px;
    border: 1px solid rgba(122, 188, 255, 0.22);
    border-bottom: 0;
    border-radius: 9px 9px 0 0;
    background: rgba(13, 35, 64, 0.72);
    color: #a9bdd0;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.3;
    text-align: center;
    text-decoration: none;
    transition: background-color .16s ease, color .16s ease, border-color .16s ease;
  }
  .report-tab:hover {
    background: rgba(21, 55, 96, 0.90);
    color: #eef7ff;
  }
  .report-tab.active {
    border-color: rgba(53, 213, 255, 0.52);
    background: #020a13;
    color: #fff;
    box-shadow: inset 0 3px 0 #35d5ff;
  }
  @media (max-width: 640px) {
    .report-tabs { gap: 4px; padding: 9px 10px 0; }
    .report-tab { min-width: 84px; padding: 10px 13px; font-size: 13px; }
  }
</style>
<nav class="report-tabs-shell" aria-label="任务报表导航" style="--report-tabs-max-width: {{ report_tabs_max_width|default('1680px') }}; --report-tabs-side-padding: {{ report_tabs_side_padding|default('20px') }};">
  <div class="report-tabs">
    <a class="report-tab{% if active_report_tab == 'dashboard' %} active{% endif %}" href="{{ url_for('daily_stats.index') }}"{% if active_report_tab == 'dashboard' %} aria-current="page"{% endif %}>任务看板</a>
    <a class="report-tab{% if active_report_tab == 'daily' %} active{% endif %}" href="{{ url_for('daily_stats.daily_stats', date=selected_date) if selected_date is defined else url_for('daily_stats.daily_stats') }}"{% if active_report_tab == 'daily' %} aria-current="page"{% endif %}>任务日报</a>
    <a class="report-tab{% if active_report_tab == 'weekly' %} active{% endif %}" href="{{ url_for('daily_stats.weekly_stats', date=selected_date) if selected_date is defined else url_for('daily_stats.weekly_stats') }}"{% if active_report_tab == 'weekly' %} aria-current="page"{% endif %}>任务周报</a>
    <a class="report-tab{% if active_report_tab == 'annual' %} active{% endif %}" href="{{ url_for('daily_stats.annual_stats', date=selected_date) if selected_date is defined else url_for('daily_stats.annual_stats') }}"{% if active_report_tab == 'annual' %} aria-current="page"{% endif %}>任务年报</a>
    <a class="report-tab{% if active_report_tab == 'coverage' %} active{% endif %}" href="{{ url_for('daily_stats.coverage_stats', date=selected_date) if selected_date is defined else url_for('daily_stats.coverage_stats') }}"{% if active_report_tab == 'coverage' %} aria-current="page"{% endif %}>抓全率</a>
  </div>
</nav>
